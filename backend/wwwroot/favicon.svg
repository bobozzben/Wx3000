<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Rich Crimson with subtle depth -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3352"/>
      <stop offset="35%" stop-color="#e60026"/>
      <stop offset="85%" stop-color="#ab001a"/>
      <stop offset="100%" stop-color="#800012"/>
    </linearGradient>

    <!-- Top Rim Highlight -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- White Emblem Gradient for soft 3D richness -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>

    <!-- Gold Badge Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#3d0007" flood-opacity="0.5"/>
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#400007" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#bgGrad)" filter="url(#softShadow)"/>
  
  <!-- Sleek Top Inner Rim Highlight -->
  <rect x="22" y="22" width="468" height="468" rx="116" fill="none" stroke="url(#rimGrad)" stroke-width="3"/>

  <!-- Main "Hi" Dynamic Emblem -->
  <g filter="url(#softShadow)" fill="url(#whiteGrad)">
    
    <!-- Outer Dynamic Swoosh -->
    <path d="M 238,52 
             C 134,52 56,134 56,252 
             C 56,370 142,454 256,454 
             C 342,454 412,398 438,316 
             C 443,300 446,282 446,262 
             L 396,262 
             C 396,276 394,290 388,303 
             C 367,358 316,406 256,406 
             C 168,406 104,338 104,252 
             C 104,164 162,100 238,100 
             C 260,100 282,106 302,116 
             L 322,70 
             C 296,58 268,52 238,52 Z" />

    <!-- The 'i' dot -->
    <ellipse cx="421" cy="192" rx="24" ry="22" transform="rotate(-14 421 192)" />

    <!-- EXACT DNA 'H' -->
        <!-- Authentic H: Left Leg, Right Leg, Crossbar with rounded joins -->
    <g stroke="url(#whiteGrad)" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
      <polygon points="212,186 272,186 202,326 142,326" />
      <polygon points="320,186 380,186 310,326 250,326" />
      <polygon points="190,238 332,238 322,270 180,270" />
    </g>
  </g>

  <!-- Ultra-readable Gold Badge -->
  <g transform="translate(305, 48)">
    <rect x="0" y="0" width="160" height="66" rx="22" fill="url(#goldGrad)" filter="url(#badgeShadow)"/>
    <rect x="2" y="2" width="156" height="62" rx="20" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.9"/>
    <text x="80" y="47" font-family="'Segoe UI', 'Arial Black', sans-serif" font-size="40" font-weight="900" font-style="italic" letter-spacing="2" text-anchor="middle" fill="#451a03">WEB</text>
  </g>
</svg>

