name: Wx3000 CI (Frontend + Backend + Electron)

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch: # 支援在 GitHub 網頁手動點擊觸發測試

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 模組 1 & 3：前端 (React + Vite) 編譯與桌面端 (Electron) 打包驗證
  # ============================================================================
  frontend-and-electron-ci:
    name: 1. Frontend & 3. Electron Build
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: '[Module 1] Build Frontend (TypeScript + Vite)'
        run: pnpm --filter frontend build

      - name: '[Module 3] Verify Electron Desktop Packaging (Unpacked Dir)'
        # 在 GitHub Actions 雲端環境直接使用官方 CDN 打包免安裝目錄版以驗證 Electron 可行性
        run: pnpm --filter frontend exec electron-builder --dir --win --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  # ============================================================================
  # 模組 2：後端 (C# .NET 8 Web API) 編譯驗證
  # ============================================================================
  backend-ci:
    name: 2. Backend (.NET 8 API) Build
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore backend/Wx3000.Backend.csproj

      - name: '[Module 2] Build Backend API (Release)'
        run: dotnet build backend/Wx3000.Backend.csproj --configuration Release --no-restore
