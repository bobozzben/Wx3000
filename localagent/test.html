<!DOCTYPE html><html><head><meta charset="utf-8"><title>v26 Generic</title></head><body>
<h2>Rx3000Agent v26 - 通用版 (多DLL多函數)</h2>
<div>編輯 dlls.json 就能新增 DLL / 函數，不用改程式碼</div>
<button onclick="loadList()">載入 dlls.json</button> <button onclick="fetch('/config').then(r=>r.json()).then(j=>log(JSON.stringify(j,null,2)))">config</button>
<hr>
<h3>通用呼叫</h3>
DLL Key: <input id="dll" value="wbaseRP"> Func: <input id="func" value="waccrep3101_b"> 
Args JSON: <input id="args" value='[1,10,10,0,0,"C:\\temp\\wbase_test.pdf"]' style="width:400px"><br><br>
<button onclick="callGeneric()">呼叫 /api/call</button> <button onclick="callWs()">WS 呼叫</button>
<hr>
<h3>舊相容 wbaseReport</h3>
<button onclick="testOld()">GET /wbaseReport</button>
<pre id="log" style="background:#eee;padding:10px;height:400px;overflow:auto"></pre>
<script>
let ws; function log(m){ document.getElementById('log').textContent += m+"\n"; }
function ensureWs(cb){ if(ws&&ws.readyState===1){cb();return;} ws=new WebSocket('ws://localhost:18889'); ws.onopen=cb; ws.onmessage=e=>log("[WS] "+e.data); }
function loadList(){ fetch('/dllList').then(r=>r.json()).then(j=>log(JSON.stringify(j,null,2))); }
function callGeneric(){
  const dll=document.getElementById('dll').value, func=document.getElementById('func').value, args=JSON.parse(document.getElementById('args').value);
  fetch('/api/call',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dll,func,args})}).then(r=>r.json()).then(j=>log(JSON.stringify(j,null,2)));
}
function callWs(){
  const dll=document.getElementById('dll').value, func=document.getElementById('func').value, args=JSON.parse(document.getElementById('args').value);
  ensureWs(()=>{ ws.send(JSON.stringify({cmd:'call',dll,func,args})); log("[SEND] call "+dll+"."+func); });
}
function testOld(){ fetch('/wbaseReport?hs_chk=1&top_mag=10&left_mag=10&PrtIndex=0&IsPrint=0&path=C%3A%5Ctemp%5Cwbase_test.pdf').then(r=>r.json()).then(j=>log(JSON.stringify(j,null,2))); }
loadList();
</script></body></html>
